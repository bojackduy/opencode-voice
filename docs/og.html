<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        background: #0b0f14;
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: flex;
        align-items: center;
        padding: 80px;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      .title {
        font-size: 72px;
        font-weight: 800;
        line-height: 1;
      }
      .grad {
        background: linear-gradient(135deg, #22d3ee, #a78bfa);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .sub {
        font-size: 30px;
        color: #94a3b8;
        max-width: 900px;
      }
      .tags {
        display: flex;
        gap: 12px;
        font-family: ui-monospace, monospace;
        font-size: 16px;
        color: #22d3ee;
      }
      .tag {
        border: 1px solid #1f2937;
        padding: 6px 12px;
        border-radius: 6px;
      }
      .logo {
        position: absolute;
        right: 80px;
        top: 80px;
      }
      .bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 6px;
        background: linear-gradient(90deg, #22d3ee, #a78bfa);
      }
    </style>
  </head>
  <body>
    <div class="logo">
      <svg width="120" height="120" viewBox="0 0 128 128">
        <rect width="128" height="128" rx="24" fill="#0b0f14" />
        <g stroke="#22d3ee" stroke-width="6" stroke-linecap="round">
          <line x1="28" y1="52" x2="28" y2="76" />
          <line x1="44" y1="36" x2="44" y2="92" />
          <line x1="60" y1="24" x2="60" y2="104" />
          <line x1="76" y1="36" x2="76" y2="92" />
          <line x1="92" y1="52" x2="92" y2="76" />
        </g>
        <circle cx="64" cy="64" r="6" fill="#a78bfa" />
      </svg>
    </div>
    <div class="wrap">
      <div class="title">opencode-<span class="grad">voice</span></div>
      <div class="sub">
        Voice in. Voice out. For OpenCode.<br />Local-first STT + TTS. Bilingual vi + en. Hands-free
        conversation.
      </div>
      <div class="tags">
        <span class="tag">Local-first</span>
        <span class="tag">Bilingual</span>
        <span class="tag">AGPL-3.0</span>
        <span class="tag">v1 + v2</span>
      </div>
    </div>
    <div class="bar"></div>
  </body>
</html>
