<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        background: #0a0e14;
        color: #e6edf3;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        display: flex;
        align-items: center;
        padding: 80px;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      .title {
        font-size: 72px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.03em;
      }
      .accent {
        color: #22c55e;
      }
      .sub {
        font-size: 26px;
        color: #8b949e;
        max-width: 900px;
        line-height: 1.4;
      }
      .tags {
        display: flex;
        gap: 12px;
        font-size: 14px;
        color: #22c55e;
      }
      .tag {
        border: 1px solid #1f2937;
        padding: 6px 14px;
        border-radius: 4px;
      }
      .logo {
        position: absolute;
        right: 80px;
        top: 80px;
      }
      .bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 6px;
        background: linear-gradient(90deg, #22c55e, #34d399);
      }
      .wave {
        color: #34d399;
        letter-spacing: 4px;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <div class="logo">
      <svg width="120" height="120" viewBox="0 0 128 128">
        <rect width="128" height="128" rx="24" fill="#0a0e14" />
        <g stroke="#22c55e" stroke-width="10" stroke-linecap="round">
          <line x1="28" y1="52" x2="28" y2="76" />
          <line x1="44" y1="36" x2="44" y2="92" />
          <line x1="60" y1="24" x2="60" y2="104" />
          <line x1="76" y1="36" x2="76" y2="92" />
          <line x1="92" y1="52" x2="92" y2="76" />
        </g>
        <circle cx="64" cy="64" r="6" fill="#34d399" />
      </svg>
    </div>
    <div class="wrap">
      <div class="title">opencode-<span class="accent">voice</span></div>
      <div class="sub">
        Voice in. Voice out. For OpenCode.<br />Local-first STT + TTS. Bilingual vi + en. Hands-free
        conversation.
      </div>
      <div class="wave">▁▃▆█▆▃▁</div>
      <div class="tags">
        <span class="tag">local-first</span>
        <span class="tag">bilingual</span>
        <span class="tag">AGPL-3.0</span>
        <span class="tag">v1 + v2</span>
      </div>
    </div>
    <div class="bar"></div>
  </body>
</html>
